<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kostol sv. Kataríny Alexandrijskej · Banská Štiavnica</title>
<meta name="description" content="Sprievodca Kostolom sv. Kataríny Alexandrijskej v Banskej Štiavnici — prehliadka interiéru v 9 jazykoch.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="page page-home">

  <div class="hero">
    <svg class="arch" width="68" height="82" viewBox="0 0 100 120" aria-hidden="true">
      <path class="arch-fill" d="M8 118 L8 58 C8 24 28 6 50 3 C72 6 92 24 92 58 L92 118 Z"/>
      <path class="arch-inner" d="M16 112 L16 59 C16 30 32 14 50 11 C68 14 84 30 84 59 L84 112 Z"/>
      <text class="arch-emoji" x="50" y="78">⛪</text>
    </svg>
    <p class="eyebrow" id="eyebrow">Vitajte</p>
    <h1 id="title">Kostol sv. Kataríny Alexandrijskej</h1>
    <p class="hero-sub" id="heroSub">Banská Štiavnica · 1488 – 1500</p>
  </div>

  <div class="chips" id="langSwitcher"></div>

  <div class="text-panel" style="margin-bottom:14px;">
    <p class="dropcap" id="intro"></p>
  </div>

  <div class="info-panel">
    <div class="info-row">
      <div class="info-ic">📍</div>
      <div>
        <p class="label" id="addressLabel">Adresa</p>
        <p id="addressValue"></p>
      </div>
    </div>
    <div class="info-row">
      <div class="info-ic">🕘</div>
      <div>
        <p class="label" id="hoursLabel">Otváracie hodiny</p>
        <div id="hoursValue"></div>
      </div>
    </div>
    <div class="info-row">
      <div class="info-ic">✉</div>
      <div>
        <p class="label" id="contactLabel">Kontakt</p>
        <p id="contactValue"></p>
      </div>
    </div>
  </div>

  <div class="orn"><i></i><b>✦</b><i></i></div>

  <div class="plan-box full" id="planBox">
    <p class="plan-title" id="planTitle">Plán kostola</p>
    <div id="planHolder"></div>
  </div>

  <div class="orn"><i></i><b>✦</b><i></i></div>

  <p class="eyebrow" style="margin-bottom:12px;" id="stopsHeading">Zastávky prehliadky</p>
  <div id="groups"></div>

  <p class="eyebrow" style="margin:24px 0 8px;" id="extrasHeading">Ďalšie čítanie</p>
  <ul class="stop-list" id="extraList"></ul>

  <footer><span id="footerLabel">Sprievodca kostolom</span></footer>
</div>

<script src="assets/tour-data.js"></script>
<script src="assets/stops/stop1.js"></script>
<script src="assets/stops/stop2.js"></script>
<script src="assets/stops/stop3.js"></script>
<script src="assets/stops/stop4.js"></script>
<script src="assets/stops/stop5.js"></script>
<script src="assets/stops/stop6.js"></script>
<script src="assets/stops/stop7.js"></script>
<script src="assets/stops/stop8.js"></script>
<script src="assets/stops/stop9.js"></script>
<script src="assets/stops/stop10.js"></script>
<script src="assets/stops/stop11.js"></script>
<script src="assets/stops/extra-katarina.js"></script>
<script src="assets/stops/extra-stiavnica.js"></script>
<script src="assets/plan.js"></script>
<script src="assets/index-render.js"></script>
</body>
</html>
